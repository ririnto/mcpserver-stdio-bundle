name: auto-tag-upstream-mcpserver

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: { }

permissions:
  contents: write
  actions: write

concurrency: auto-tag-upstream

env:
  METADATA_URL: https://www.jetbrains.com/intellij-repository/releases/com/jetbrains/intellij/mcpserver/mcpserver/maven-metadata.xml

jobs:
  tag-if-new:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine latest upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/upstream_version.txt
          import os, re, sys, time, urllib.request, xml.etree.ElementTree as ET

          url = os.environ.get("METADATA_URL")
          if not url:
            print("ERROR: METADATA_URL is not set", file=sys.stderr)
            sys.exit(1)

          data = None
          for attempt in range(1, 4):
            try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                data = resp.read()
              break
            except Exception as e:
              if attempt == 3:
                print(f"ERROR: failed to download metadata after {attempt} attempts: {e}", file=sys.stderr)
                sys.exit(1)
              time.sleep(2 ** (attempt - 1))

          root = ET.fromstring(data)
          release = root.findtext("./versioning/release") or root.findtext("./versioning/latest")
          if not release:
            versions = [v.text for v in root.findall("./versioning/versions/version") if v.text]
            if versions:
              release = versions[-1]

          if not release or not re.fullmatch(r"[0-9]+(\.[0-9]+)*", release):
            print("ERROR: cannot parse a valid upstream version", file=sys.stderr)
            sys.exit(1)

          print(release)
          PY

          VERSION="$(cat /tmp/upstream_version.txt)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag and dispatch incomplete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          api_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          response=$(mktemp)
          trap 'rm -f -- "$response"' EXIT
          status=$(curl -sS --max-time 30 -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url/releases/tags/$TAG")
          case "$status" in
            200)
              complete=$(jq -er --arg tag "$TAG" --arg jar "mcpserver-stdio-${TAG#v}-bundle.jar" '
                if .tag_name != $tag or (.draft | type) != "boolean" or (.assets | type) != "array" then
                  error("Invalid release response for " + $tag)
                else
                  .draft == false and any(.assets[]; .name == $jar and .state == "uploaded" and (.size | type) == "number" and .size > 0)
                end | tostring' "$response")
              if [ "$complete" = true ]; then
                echo "Release $TAG already has its bundle"
                exit 0
              fi
              ;;
            404) ;;
            *)
              echo "ERROR: release lookup for $TAG returned HTTP $status" >&2
              exit 1
              ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Upstream mcpserver release $TAG"
            git push origin "refs/tags/$TAG"
          fi

          curl -sS --fail-with-body --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$api_url/actions/workflows/release-on-tag.yaml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"${TAG}\"}}"
