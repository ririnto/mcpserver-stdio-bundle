name: Validate pull requests

"on":
  pull_request:

permissions:
  contents: read

env:
  MCP_VERSION: '253.28294.334'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check release dispatch behavior
        run: python3 tests/release_dispatch.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and smoke test bundle
        shell: bash
        run: |-
          ./gradlew --no-daemon clean build -PmcpVersion="$MCP_VERSION"
          test -f "build/libs/mcpserver-stdio-${MCP_VERSION}-bundle.jar"
          python3 tests/stdio_smoke.py --java "$JAVA_HOME/bin/java" "build/libs/mcpserver-stdio-${MCP_VERSION}-bundle.jar"
